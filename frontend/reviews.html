<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ulasan Anda | Mangan Yukkk</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
      .reviews-page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 112px 28px 48px;
      }

      .reviews-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 22px;
        color: #171717;
        font-size: 16px;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .reviews-title iconify-icon {
        font-size: 17px;
      }

      .reviews-list {
        display: grid;
        justify-items: start;
        gap: 16px;
      }

      .reviews-list[hidden],
      .reviews-state[hidden],
      .reviews-title[hidden] {
        display: none;
      }

      .review-card {
        width: min(100%, 650px);
        padding: 16px 18px;
        border: 1px solid #d1d1d1;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 8%);
      }

      .review-card-content {
        min-width: 0;
      }

      .review-card-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .review-author {
        display: flex;
        align-items: flex-start;
        min-width: 0;
        gap: 10px;
      }

      .review-avatar {
        display: grid;
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 50%;
        background: #001b7d;
        color: #fff;
      }

      .review-avatar iconify-icon {
        font-size: 21px;
      }

      .review-author-details {
        min-width: 0;
      }

      .review-author-name {
        display: block;
        margin: 0 0 2px;
        color: #111;
        font-size: 14px;
        font-weight: 500;
      }

      .review-rating-date {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .review-rating {
        color: #f2a900;
        font-size: 14px;
        letter-spacing: 1px;
        line-height: 1;
      }

      .review-date {
        color: #454545;
        font-size: 9px;
      }

      .review-place {
        display: none;
      }

      .review-comment {
        margin: 9px 0 10px;
        overflow-wrap: anywhere;
        color: #333;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .review-photo {
        display: block;
        width: 54px;
        height: 44px;
        margin: 0 0 10px;
        border-radius: 7px;
        object-fit: cover;
      }

      .review-food-link {
        display: flex;
        align-items: center;
        min-height: 60px;
        gap: 10px;
        padding: 6px 10px;
        border: 1px solid #c9c9c9;
        border-radius: 7px;
        color: inherit;
        text-decoration: none;
      }

      .review-food-photo {
        flex: 0 0 52px;
        width: 52px;
        height: 46px;
        border-radius: 6px;
        object-fit: cover;
        background: #eee;
      }

      .review-food-details {
        min-width: 0;
      }

      .review-food-name {
        display: block;
        margin-bottom: 4px;
        color: #111;
        font-size: 14px;
        font-weight: 500;
      }

      .review-food-address {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #555;
        font-size: 10px;
      }

      .review-food-address iconify-icon {
        flex: 0 0 auto;
        color: #888;
        font-size: 14px;
      }

      .review-owner-actions {
        display: inline-flex;
        flex: 0 0 auto;
        gap: 8px;
      }

      .review-action {
        display: inline-grid;
        place-items: center;
        border: 0;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        background: #001b7d;
        color: #fff;
        cursor: pointer;
        text-decoration: none;
      }

      .review-action iconify-icon {
        font-size: 18px;
      }

      .review-action:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .reviews-state {
        padding: 8px 16px;
        text-align: center;
      }

      .reviews-empty-icon {
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 10px;
        color: #929292;
        font-size: 32px;
      }

      .reviews-error-icon {
        display: block;
        width: 32px;
        height: 32px;
        margin: 0 auto 12px;
        color: #929292;
        font-size: 32px;
      }

      .reviews-error-title {
        margin: 0 0 5px;
        color: #111;
        font-size: 14px;
        font-weight: 500;
      }

      .reviews-empty-title {
        margin: 0 0 7px;
        color: #111;
        font-size: 14px;
        font-weight: 500;
      }

      .reviews-empty-copy {
        margin: 0;
        color: #111;
        font-size: 11px;
      }

      .reviews-retry {
        border: 0;
        padding: 0;
        background: none;
        color: #001b7d;
        font: inherit;
        font-size: 10px;
        text-decoration: underline;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .reviews-page {
          padding: 104px 16px 32px;
        }

        .review-card {
          padding: 13px;
        }

        .review-card-heading {
          gap: 6px;
        }

        .review-owner-actions {
          gap: 5px;
        }

        .review-action {
          width: 31px;
          height: 31px;
        }

        .review-food-name {
          font-size: 12px;
        }

        .review-food-address {
          font-size: 9px;
        }
      }
    </style>
  </head>
  <body>
    <div id="navbar-container"></div>
    <main class="reviews-page">
      <h1 id="reviewsTitle" class="reviews-title">Riwayat Ulasan Anda <iconify-icon icon="codicon:code-review" aria-hidden="true"></iconify-icon></h1>
      <div id="reviewsLoading" class="reviews-state" role="status">Memuat ulasan...</div>
      <div id="reviewsEmpty" class="reviews-state" hidden>
        <iconify-icon class="reviews-empty-icon" icon="fluent:comment-error-16-regular" aria-hidden="true"></iconify-icon>
        <h2 class="reviews-empty-title">Belum Ada Ulasan</h2>
        <p class="reviews-empty-copy">YUKKK, bagikan pengalamanmu setelah mencoba kuliner favoritmu!</p>
      </div>
      <div id="reviewsError" class="reviews-state" role="alert" hidden>
        <iconify-icon class="reviews-error-icon" icon="fluent:comment-dismiss-24-regular" aria-hidden="true"></iconify-icon>
        <h2 class="reviews-error-title">Gagal memuat halaman</h2>
        <button id="retryReviews" class="reviews-retry" type="button">Silahkan coba lagi</button>
      </div>
      <div id="reviewsList" class="reviews-list" hidden></div>
    </main>
    <script src="js/navbar.js"></script>
    <script>
      const BASE_URL = "http://localhost/ABIG-Anak-Buah-Ibu-Ghina-/backend";

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("retryReviews").addEventListener("click", loadReviews);
        document.getElementById("reviewsList").addEventListener("click", handleReviewAction);
        loadReviews();
      });

      async function loadReviews() {
        const title = document.getElementById("reviewsTitle");
        const loading = document.getElementById("reviewsLoading");
        const empty = document.getElementById("reviewsEmpty");
        const error = document.getElementById("reviewsError");
        const list = document.getElementById("reviewsList");

        title.hidden = false;
        loading.hidden = false;
        empty.hidden = true;
        error.hidden = true;
        list.hidden = true;
        list.replaceChildren();

        try {
          const response = await fetch(`${BASE_URL}/api/ulasan.php?milik_saya=1`, {
            method: "GET",
            credentials: "include",
          });

          if (response.status === 401) {
            const returnTo = encodeURIComponent("reviews.html");
            window.location.href = `login.html?returnTo=${returnTo}`;
            return;
          }

          const result = await response.json();
          if (!response.ok || !result.status) {
            throw new Error(result.message || "Gagal memuat daftar ulasan.");
          }

          const reviews = Array.isArray(result.data) ? result.data : [];
          loading.hidden = true;
          if (reviews.length === 0) {
            empty.hidden = false;
            return;
          }

          renderReviews(reviews);
          list.hidden = false;
        } catch (requestError) {
          console.error("Gagal memuat daftar ulasan:", requestError);
          loading.hidden = true;
          title.hidden = true;
          error.hidden = false;
        }
      }

      function renderReviews(reviews) {
        const list = document.getElementById("reviewsList");
        list.innerHTML = reviews.map((review) => {
          const foodName = review.nama_kuliner || review.nama_tempat || "Kuliner";
          const foodPhoto = resolveFoodPhoto(review.photo_url);
          const reviewPhoto = resolveReviewPhoto(review.foto_url);
          const rating = Number(review.rating);
          const reviewDate = formatReviewDate(review.created_at);
          const reviewStars = rating >= 1 && rating <= 5 ? "★".repeat(rating) : "";
          const address = review.alamat || review.nama_tempat || "";

          return `
            <article class="review-card">
              <div class="review-card-content">
                <div class="review-card-heading">
                  <div class="review-author">
                    <span class="review-avatar" aria-hidden="true">
                      <iconify-icon icon="material-symbols:person" aria-hidden="true"></iconify-icon>
                    </span>
                    <div class="review-author-details">
                      <strong class="review-author-name">${escapeHTML(review.nama_user || "Pengguna")}</strong>
                      <div class="review-rating-date">
                        ${reviewStars ? `<span class="review-rating" aria-label="Rating ${rating} dari 5">${reviewStars}</span>` : ""}
                        <time class="review-date">${escapeHTML(reviewDate)}</time>
                      </div>
                    </div>
                  </div>
                  <div class="review-owner-actions" aria-label="Aksi ulasan milik Anda">
                    <a class="review-action" href="detail_kuliner.html?id_tempat=${encodeURIComponent(review.id_tempat)}&edit_ulasan=${encodeURIComponent(review.id_ulasan)}" aria-label="Ubah ulasan">
                      <iconify-icon icon="boxicons:pencil-draw-filled" aria-hidden="true"></iconify-icon>
                    </a>
                    <button class="review-action" type="button" data-delete-review="${escapeHTML(review.id_ulasan)}" aria-label="Hapus ulasan">
                      <iconify-icon icon="bi:trash-fill" aria-hidden="true"></iconify-icon>
                    </button>
                  </div>
                </div>
                ${review.review_text ? `<p class="review-comment">${escapeHTML(review.review_text)}</p>` : ""}
                ${reviewPhoto ? `<img class="review-photo" src="${escapeHTML(reviewPhoto)}" alt="Foto pada ulasan" loading="lazy" />` : ""}
                <a class="review-food-link" href="detail_kuliner.html?id_tempat=${encodeURIComponent(review.id_tempat)}">
                  <img class="review-food-photo" src="${escapeHTML(foodPhoto)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e0e0e0/555555?text=Kuliner'" />
                  <span class="review-food-details">
                    <strong class="review-food-name">${escapeHTML(foodName)}</strong>
                    <span class="review-food-address"><iconify-icon icon="material-symbols:location-on" aria-hidden="true"></iconify-icon>${escapeHTML(address)}</span>
                  </span>
                </a>
              </div>
            </article>
          `;
        }).join("");
      }

      async function handleReviewAction(event) {
        const button = event.target.closest("[data-delete-review]");
        if (!button) return;

        if (!window.confirm("Yakin ingin menghapus ulasan ini?")) return;
        button.disabled = true;

        try {
          const response = await fetch(`${BASE_URL}/api/ulasan.php`, {
            method: "DELETE",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id_ulasan: button.dataset.deleteReview }),
          });
          const result = await response.json();

          if (response.status === 401) {
            window.location.href = `login.html?returnTo=${encodeURIComponent("reviews.html")}`;
            return;
          }
          if (!response.ok || !result.status) {
            throw new Error(result.message || "Ulasan gagal dihapus.");
          }

          await loadReviews();
          window.alert("Ulasan berhasil dihapus.");
        } catch (error) {
          console.error("Gagal menghapus ulasan:", error);
          window.alert(error.message || "Ulasan gagal dihapus. Silakan coba lagi.");
          button.disabled = false;
        }
      }

      function resolveFoodPhoto(path) {
        if (!path) return "https://placehold.co/400x300/e0e0e0/555555?text=Kuliner";
        if (/^https?:\/\//i.test(path)) return path;
        return `${BASE_URL}/uploads/${String(path).replace(/^\/+|^uploads\//g, "")}`;
      }

      function resolveReviewPhoto(path) {
        if (!path) return "";
        if (/^https?:\/\//i.test(path)) return path;
        return `${BASE_URL}/${String(path).replace(/^\/+/, "")}`;
      }

      function formatReviewDate(value) {
        if (!value) return "";
        const dateValue = String(value).trim();
        const isoDate = dateValue.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (isoDate) return `${isoDate[3]}/${isoDate[2]}/${isoDate[1]}`;

        const localizedDate = dateValue.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})/);
        if (localizedDate) {
          return `${localizedDate[1].padStart(2, "0")}/${localizedDate[2].padStart(2, "0")}/${localizedDate[3]}`;
        }

        const date = new Date(dateValue);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("id-ID", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        }).format(date);
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[character]);
      }
    </script>
  </body>
</html>
