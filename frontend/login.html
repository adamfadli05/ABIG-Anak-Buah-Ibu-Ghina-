<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#001b7d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Login | Mangan Yukkk</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    
    <!-- Google Fonts: Instrument Serif & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Iconify Script -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  </head>
  <body>
    <div class="auth-container">
      <!-- Header Datar -->
      <div class="auth-header">
        <a href="index.html" class="back-btn" aria-label="Kembali">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
        </a>
        <h1 class="auth-brand">
          <span>MANGAN</span>
          <span>yukkk</span>
        </h1>
        <p class="auth-subtitle">Kuliner Khas Cirebon</p>
      </div>

      <!-- Form Login -->
      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label>EMAIL :</label>
          <div class="input-wrapper">
            <iconify-icon icon="dashicons:email-alt" class="input-icon"></iconify-icon>
            <input type="email" placeholder="Masukan Email Anda" required />
          </div>
        </div>

        <div class="form-group">
  <label>KATA SANDI :</label>
  <div class="input-wrapper" style="position: relative;">
    <iconify-icon icon="boxicons:key-alt-filled" class="input-icon key-icon"></iconify-icon>
    <input type="password" placeholder="Masukan Kata Sandi Anda" required style="padding-right: 40px;" />
    <iconify-icon icon="ri:eye-off-line" class="toggle-password" style="cursor: pointer; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 20px; color: #666; z-index: 10;"></iconify-icon>
  </div>
</div>

        <button type="submit" class="btn-submit">MASUK</button>

        <div class="divider">Atau :</div>

        <button type="button" class="btn-google" id="googleLoginBtn">
          <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Masuk Dengan Google
        </button>
        <div class="auth-footer">
          <p>Belum punya akun ?</p>
          <a href="register.html">Daftar</a>
        </div>
      </form>
    </div>

    <script>
      const BASE_URL = "http://localhost/ABIG-Anak-Buah-Ibu-Ghina-/backend";

      // Fitur Klik Toggle Buka / Tutup Password
      document.querySelectorAll(".toggle-password").forEach((toggleIcon) => {
        toggleIcon.addEventListener("click", function () {
          const input = this.previousElementSibling;
          if (input.type === "password") {
            input.type = "text";
            this.setAttribute("icon", "ri:eye-line");
          } else {
            input.type = "password";
            this.setAttribute("icon", "ri:eye-off-line");
          }
        });
      });

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email    = e.target.querySelector('input[type="email"]').value;
        const password = e.target.querySelector('input[type="password"]').value;
        const btnSubmit = e.target.querySelector('.btn-submit');

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Memproses...";

        try {
          const res  = await fetch(`${BASE_URL}/api/login.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });

          const data = await res.json();

          if (!data.status) {
            alert(data.message);
            return;
          }

          localStorage.setItem("user", JSON.stringify(data.data));
          localStorage.setItem("role", data.role);

          if (data.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "index.html";
          }

        } catch (err) {
          alert("Gagal terhubung ke server. Coba lagi.");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "MASUK";
        }
      });

      document.getElementById("googleLoginBtn").addEventListener("click", () => {
        window.location.href = `${BASE_URL}/google.php`;
      });
    </script>
  </body>
</html>
