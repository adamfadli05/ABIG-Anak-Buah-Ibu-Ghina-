<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Mangan Yukkk</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" class="back-btn" aria-label="Kembali">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
        </a>
        <h1 class="auth-brand">
          <span>MANGAN</span>
          <span>yukkk</span>
        </h1>
        <p class="auth-subtitle">Kuliner Khas Cirebon</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label>EMAIL :</label>
          <div class="input-wrapper">
            <span class="input-icon">✉</span>
            <input type="email" placeholder="Masukan Email Anda" required />
          </div>
        </div>

        <div class="form-group">
          <label>KATA SANDI :</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" placeholder="Masukan Kata Sandi Anda" required />
          </div>
        </div>

        <button type="submit" class="btn-submit">MASUK</button>

        <div class="divider">Atau :</div>

        <button type="button" class="btn-google" id="googleLoginBtn"><span class="google-g">G</span> Masuk Dengan Google</button>

        <p class="auth-footer">Belum punya akun ? <a href="register.html">Daftar</a></p>
      </form>
    </div>

   <script>
  const BASE_URL = "https://parcel-departmental-tmp-bonds.trycloudflare.com/ABIG-Anak-Buah-Ibu-Ghina-/backend";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email    = e.target.querySelector('input[type="email"]').value;
    const password = e.target.querySelector('input[type="password"]').value;
    const btnSubmit = e.target.querySelector('.btn-submit');

    btnSubmit.disabled = true;
    btnSubmit.textContent = "Memproses...";

    try {
      const res  = await fetch(`${BASE_URL}/api/login.php`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!data.status) {
        alert(data.message);
        return;
      }

      localStorage.setItem("user", JSON.stringify(data.data));
      localStorage.setItem("role", data.role);

      if (data.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "index.html";
      }

    } catch (err) {
      alert("Gagal terhubung ke server. Coba lagi.");
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = "MASUK";
    }
  });

  document.getElementById("googleLoginBtn").addEventListener("click", () => {
    window.location.href = `${BASE_URL}/google.php`;
  });
</script>
  </body>
</html>
