<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#001b7d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Login | Mangan Yukkk</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />

    <!-- Google Fonts: Instrument Serif & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Iconify Script -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <style>
      /* Modal Popup Presisi */
      #responseModal {
        display: none !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: rgba(217, 217, 217, 0.7) !important; /* DIPERBAIKI: Latar Abu-Abu Transparan */
        z-index: 2147483647 !important;
        justify-content: center !important;
        align-items: center !important;
      }

      #responseModal.show {
        display: flex !important;
      }

      #responseModal .modal-card-custom {
        background: #ffffff !important;
        border-radius: 20px !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25) !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        padding: 24px 24px 16px 24px !important;
        min-width: 280px !important;
        max-width: 340px !important;
        box-sizing: border-box !important;
      }

      #responseModal .modal-text {
        font-family: "Inter" !important;
        font-size: 20px !important; /* DIPERBAIKI: Ukuran Teks Digedein ke 20px */
        font-weight: 400 !important;
        text-align: center !important;
        color: #001b7d !important;
        margin: 14px 0 16px 0 !important;
        line-height: 1.4 !important;
      }

      .modal-actions-custom {
        width: 100% !important;
        display: flex !important;
        justify-content: flex-end !important;
        margin-top: 8px !important;
      }

      #modalCloseBtn {
        background: none !important;
        border: none !important;
        color: #001b7d !important;
        font-family: "Inter" !important;
        font-size: 15px !important;
        font-weight: 400 !important;
        text-decoration: underline !important;
        cursor: pointer !important;
        padding: 4px 8px !important;
      }

      /* STYLING BANNER ERROR MERAH CAPSULE */
      .error-banner-capsule {
        display: none;
        background-color: #e33629 !important;
        color: #ffffff !important;
        font-family: "Inter", sans-serif !important;
        font-size: 16px !important;
        font-weight: 400 !important;
        text-align: center !important;
        border-radius: 12px !important;
        padding: 10px 16px !important;
        margin: 14px auto !important;
        width: 100% !important;
        max-width: 240px !important;
        box-sizing: border-box !important;
        line-height: 1.3 !important;
        box-shadow: 0 2px 8px rgba(234, 56, 41, 0.2) !important;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <!-- Header Datar -->
      <div class="auth-header">
        <a href="index.html" class="back-btn" aria-label="Kembali">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" /></svg>
        </a>
        <h1 class="auth-brand">
          <span>MANGAN</span>
          <span>YUKKK</span>
        </h1>
        <p class="auth-subtitle">Kuliner Khas Cirebon</p>
      </div>

      <!-- Form Login -->
      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label>EMAIL :</label>
          <div class="input-wrapper">
            <iconify-icon icon="dashicons:email-alt" class="input-icon"></iconify-icon>
            <input type="email" id="emailInput" placeholder="Masukan Email Anda" autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label>KATA SANDI :</label>
          <div class="input-wrapper">
            <iconify-icon icon="boxicons:key-alt-filled" class="input-icon key-icon"></iconify-icon>
            <input type="password" id="passwordInput" placeholder="Masukan Kata Sandi Anda" />
            <iconify-icon icon="codicon:eye-closed" class="toggle-password" style="cursor: pointer"></iconify-icon>
          </div>
        </div>

        <!-- Banner Error Merah Capsule -->
        <div id="errorBanner" class="error-banner-capsule"></div>

        <button type="submit" class="btn-submit">Masuk</button>

        <div class="divider">Atau :</div>

        <button type="button" class="btn-google" id="googleLoginBtn">
          <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
          </svg>
          Masuk Dengan Google
        </button>

        <div class="auth-footer">
          <p>Belum punya akun ?</p>
          <a href="register.html">Daftar</a>
        </div>
      </form>
    </div>

    <!-- MODAL POPUP RESPONSE -->
    <div id="responseModal">
      <div class="modal-card-custom">
        <div id="modalIcon"></div>
        <p id="modalMessage" class="modal-text"></p>
        <div class="modal-actions-custom">
          <button type="button" id="modalCloseBtn">Oke</button>
        </div>
      </div>
    </div>

    <script>
      const BASE_URL = "http://localhost/ABIG-Anak-Buah-Ibu-Ghina-/backend";
      const loginForm = document.getElementById("loginForm");

      const responseModal = document.getElementById("responseModal");
      const modalIcon = document.getElementById("modalIcon");
      const modalMessage = document.getElementById("modalMessage");
      const modalCloseBtn = document.getElementById("modalCloseBtn");
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');

      let isLoginSuccess = false;
      let redirectTarget = "index.html";

      function showError(message) {
        const errorBanner = document.getElementById("errorBanner");
        if (!errorBanner) return;
        errorBanner.innerHTML = message;
        errorBanner.style.setProperty("display", "block", "important");
      }

      function clearErrors() {
        const errorBanner = document.getElementById("errorBanner");
        if (errorBanner) {
          errorBanner.innerHTML = "";
          errorBanner.style.setProperty("display", "none", "important");
        }
        document.querySelectorAll(".input-wrapper").forEach((wrapper) => {
          wrapper.classList.remove("error");
        });
      }

      function showPopupModal(isSuccess, customMessage = null) {
        isLoginSuccess = isSuccess;

        if (isSuccess) {
          modalIcon.innerHTML = `<iconify-icon icon="mdi:check-circle" style="color: #28a745; font-size: 39px;"></iconify-icon>`;
          modalMessage.innerHTML = customMessage ? customMessage : "Anda berhasil masuk";
        } else {
          modalIcon.innerHTML = `<iconify-icon icon="entypo:circle-with-cross" style="color: #ea3829; font-size: 39px;"></iconify-icon>`;
          modalMessage.innerHTML = customMessage ? customMessage : "Anda Gagal masuk,<br>silahkan coba lagi";
        }

        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", "#d9d9d9");
        }
        responseModal.classList.add("show");
      }

      modalCloseBtn.addEventListener("click", (e) => {
        e.preventDefault();
        responseModal.classList.remove("show");

        if (themeColorMeta) {
          themeColorMeta.setAttribute("content", "#001b7d");
        }

        if (isLoginSuccess) {
          window.location.href = redirectTarget;
        } else {
          window.history.replaceState(null, null, window.location.pathname);
        }
      });

      // CEK STATUS LOGIN GOOGLE DARI URL
      window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const googleStatus = urlParams.get("google");
        const role = urlParams.get("role") || "user";
        const userData = urlParams.get("user");
        const googleType = urlParams.get("type");
               if (googleStatus === "success") {
          let userObj = { name: "Google User" }; // data cadangan kalau data user gagal dibaca

          if (userData) {
            try {
              let str = userData;
              for (let i = 0; i < 3; i++) {
                if (typeof str === "string" && str.includes("%")) {
                  str = decodeURIComponent(str);
                }
              }
              userObj = typeof str === "string" ? JSON.parse(str) : str;
            } catch (e) {
              console.error("Gagal simpan session user Google:", e);
            }
          }

          localStorage.setItem("user", JSON.stringify(userObj));
          localStorage.setItem("role", role);

          redirectTarget = role === "admin" ? "admin.html" : "index.html";
          showPopupModal(true, googleType === "register" ? "Pendaftaran dengan Google berhasil" : "Masuk dengan Google berhasil");
        }
      });

      // Toggle Password (codicon:eye)
      document.querySelectorAll(".toggle-password").forEach((toggleIcon) => {
        toggleIcon.addEventListener("click", function () {
          const input = this.previousElementSibling;
          if (input.type === "password") {
            input.type = "text";
            this.setAttribute("icon", "codicon:eye");
          } else {
            input.type = "password";
            this.setAttribute("icon", "codicon:eye-closed");
          }
        });
      });

      // LOGIKA FORM SUBMIT LOGIN
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const emailInput = document.getElementById("emailInput");
        const passwordInput = document.getElementById("passwordInput");

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const btnSubmit = e.target.querySelector(".btn-submit");

        clearErrors();

        const emailWrapper = emailInput.closest(".input-wrapper");
        const passwordWrapper = passwordInput.closest(".input-wrapper");

        // 1. KASUS 1: EMAIL & SANDI KOSONG ATAU SALAH SATU KOSONG
        if (!email && !password) {
          emailWrapper.classList.add("error");
          passwordWrapper.classList.remove("error");
          showError("Email dan kata sandi<br>wajib di isi");
          return;
        }

        if (!email) {
          emailWrapper.classList.add("error");
          passwordWrapper.classList.remove("error");
          showError("Email dan kata sandi<br>wajib di isi");
          return;
        }

        if (!password) {
          passwordWrapper.classList.add("error");
          emailWrapper.classList.remove("error");
          showError("Email dan kata sandi<br>wajib di isi");
          return;
        }

        // 2. KASUS 2: FORMAT EMAIL TIDAK BERAKHIRAN @gmail.com
        if (!email.toLowerCase().endsWith("@gmail.com")) {
          emailWrapper.classList.add("error");
          showError("Gunakan email yang<br>berakhiran @gmail.com");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Memproses";

        try {
          const res = await fetch(`${BASE_URL}/api/login.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await res.json();

          if (!data.status) {
            // 3. KASUS 3: EMAIL ATAU KATA SANDI SALAH DARI BACKEND
            showError("Email atau kata sandi salah,<br>silahkan coba lagi");
            return;
          }

          localStorage.setItem("user", JSON.stringify(data.data));
          localStorage.setItem("role", data.role);
          redirectTarget = data.role === "admin" ? "admin.html" : "index.html";

          showPopupModal(true, "Anda berhasil masuk");
        } catch (err) {
          showError("Terjadi kesalahan koneksi,<br>silahkan coba lagi");
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "MASUK";
        }
      });
      // Saat form login di-submit
      async function handleLogin(event) {
        event.preventDefault();
        
        const payload = { email: emailInput.value, password: passwordInput.value };

        // 1. Log request API ke Console
        console.log("[API Request] Menembak endpoint POST /api/login.php dengan payload:", payload);

        try {
          const response = await fetch(`${BASE_URL}/api/login.php`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          // 2. Log response API dari PHP ke Console
          console.log("[API Response] Balasan dari backend:", result);

          if (result.status === "success") {
            localStorage.setItem("user", JSON.stringify(result.data));
            
            // Kasih jeda sedikit atau alert biar log di Console sempat dibaca sebelum pindah halaman
            alert("Login Berhasil!");
            window.location.href = "index.html";
          } else {
            alert(result.message || "Login gagal!");
          }
        } catch (error) {
          console.error("[API Error] Gagal terhubung ke backend:", error);
        }
      }

      document.getElementById("googleLoginBtn").addEventListener("click", () => {
        window.location.href = `${BASE_URL}/google.php`;
      });
    </script>
  </body>
</html>
