<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#001b7d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin | Mangan Yukkk</title>
    <link rel="stylesheet" href="css/Dashboard_Admin.css?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="js/env.js"></script>
    <script src="js/config.js"></script>
    
    <!-- Panggil script sidebar agar otomatis termuat -->
    <script src="js/sidebar.js?v=3" defer></script>
    <script src="js/Dashboard_Admin.js?v=3" defer></script>
  </head>
  <body>
    <!-- State Autentikasi / Loading Awal -->
    <main id="authState" class="page-state" role="status" aria-live="polite">
      <h1 id="authTitle">Memeriksa akses Admin...</h1>
      <p id="authMessage">Mohon tunggu sebentar.</p>
      <button id="authRetryButton" class="button button-secondary" type="button" hidden>
        <span id="authRetryLabel">Coba lagi</span>
      </button>
    </main>

    <!-- App Utama (Tersembunyi sampai akses diverifikasi) -->
    <div id="adminApp" class="admin-app" hidden>
      
      <!-- TEMPAT PEMANGGILAN SIDEBAR OTOMATIS -->
      <div id="sidebar-container"></div>

      <!-- Panel Konten Utama -->
      <section class="main-panel">
        <header class="topbar">
          <div class="topbar-right-panel" style="margin-left: auto; display: flex; align-items: center; gap: 12px; padding: 16px 32px;">
            <div style="text-align: right; display: grid; gap: 2px;">
              <strong style="color: #001b7d; font-size: 18px; font-weight: 700;">Panel</strong>
              <span style="color: #001b7d; font-size: 13px; font-weight: 500;">Admin</span>
            </div>
            <iconify-icon icon="lucide-extended:user-cog-filled" style="color: #001b7d; font-size: 36px;" aria-hidden="true"></iconify-icon>
          </div>
        </header>

        <div class="dashboard-content">
          <section class="summary-section" aria-labelledby="summaryTitle">
            <h2 id="summaryTitle" class="sr-only">Ringkasan</h2>

            <!-- Kotak Kartu Statistik -->
            <div id="summaryCards" class="summary-grid" aria-busy="true">
              <article class="summary-card">
                <div class="summary-card-icon icon-blue"><iconify-icon icon="dashicons:food" aria-hidden="true"></iconify-icon></div>
                <p class="summary-label">Total Kuliner</p>
                <p id="totalCulinary" class="summary-value">0</p>
              </article>
              <article class="summary-card">
                <div class="summary-card-icon icon-orange"><iconify-icon icon="wordpress:category" aria-hidden="true"></iconify-icon></div>
                <p class="summary-label">Kategori</p>
                <p id="totalCategories" class="summary-value">0</p>
              </article>
              <article class="summary-card">
                <div class="summary-card-icon icon-green"><iconify-icon icon="f7:person-2-fill" aria-hidden="true"></iconify-icon></div>
                <p class="summary-label">Total Pengguna</p>
                <p id="totalUsers" class="summary-value">0</p>
              </article>
            </div>
          </section>

          <!-- Bagian Grid Daftar Kuliner -->
          <section class="culinary-section" aria-labelledby="culinaryTitle">
            <h2 id="culinaryTitle" class="sr-only">Daftar Kuliner</h2>
            <div id="culinaryCards" class="culinary-grid" hidden></div>
            <p id="culinaryEmpty" class="culinary-empty" role="status" hidden>Belum ada data kuliner.</p>
          </section>
        </div>
      </section>
    </div>
  </body>
</html>
