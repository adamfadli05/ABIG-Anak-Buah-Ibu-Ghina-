<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuliner Tersimpan | Mangan Yukkk</title>

    <!-- CSS Utama -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,500&display=swap" rel="stylesheet" />

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <style>
      :root {
        --primary: #001b7d;
        --border: #d9dce5;
        --text: #34343a;
        --muted: #6c6c73;
        --placeholder: #dedede;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 14px;
      }

      /* CONTAINER HALAMAN DESKTOP */
      .page-container {
        width: 100% !important;
        max-width: 1340px !important;
        min-height: 100vh !important;
        margin: 0 auto !important;
        padding: 24px 32px 50px !important;
        padding-top: 130px !important;
        box-sizing: border-box !important;
        background: #ffffff !important;
        position: relative !important;
      }

      /* TAMPILAN PESAN KOSONG / ERROR */
      .state-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        margin-top: 40px;
        text-align: center;
        font-family: "Inter", sans-serif;
      }

      .state-text {
        font-style: normal;
        font-weight: 400;
        font-size: 14px;
        line-height: 17px;
        color: #000000;
      }

      .state-retry-btn {
        background: none;
        border: none;
        font-family: "Inter", sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 14px;
        line-height: 17px;
        color: #001b7d;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
        display: inline;
      }

      .state-retry-btn:hover {
        opacity: 0.8;
      }

      /* ==========================================================================
         GRID KARTU KULINER (DISAMAKAN DENGAN INDEX.HTML)
         ========================================================================== */
      .saved-grid {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 20px !important;
        justify-content: flex-start !important;
        width: 100% !important;
        max-width: 1340px !important;
        margin: 0 auto !important;
      }

      .food-card {
        width: calc(25% - 15px) !important;
        min-width: 250px !important;
        max-width: 320px !important;
        min-height: 360px !important;
        padding: 12px !important;
        background: #ffffff !important;
        border: 1px solid #d4d4d4 !important;
        box-shadow: 0px 4px 4px #001b7d !important;
        border-radius: 5px !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        margin: 0 !important;
        border-bottom: 3px solid var(--primary);
        cursor: pointer;
        position: relative;
        text-decoration: none;
        color: inherit;
      }

      .food-photo {
        width: 100% !important;
        height: 190px !important;
        object-fit: cover !important;
        border-radius: 5px !important;
        display: block !important;
        margin-bottom: 8px !important;
      }

      .food-name {
        font-family: "Inter" !important;
        font-weight: 400 !important;
        font-size: 15px !important;
        line-height: 18px !important;
        text-align: left !important;
        color: #000000 !important;
        margin: 0 0 6px 0 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      /* Perbaikan Alamat agar tidak kepotong (multiline rapi) */
      .food-location {
        display: flex !important;
        align-items: flex-start !important;
        gap: 4px !important;
        color: #000000 !important;
        font-size: 12px !important;
        line-height: 15px !important;
        margin-bottom: 8px !important;
      }

      .food-location span {
        display: -webkit-box !important;
        -webkit-line-clamp: 2 !important;
        -webkit-box-orient: vertical !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      .food-location iconify-icon {
        font-size: 20px !important;
        color: #938f99 !important;
        flex-shrink: 0 !important;
      }

      .food-meta {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        margin-top: auto !important;
        font-family: "Inter" !important;
        font-size: 16px !important;
        font-weight: 400 !important;
        color: #000000 !important;
      }

      /* ==========================================================================
         RESPONSIVE MOBILE
         ========================================================================== */
      @media (max-width: 480px) {
        .page-container {
          width: 100% !important;
          max-width: 402px !important;
          margin: 0 auto !important;
          padding: 12px 16px !important;
          padding-top: 95px !important;
        }

        .saved-grid {
          display: grid !important;
          grid-template-columns: repeat(2, 165px) !important;
          justify-content: center !important;
          gap: 16px !important;
          padding: 0 !important;
          width: 100% !important;
          margin: 0 auto !important;
        }

        .food-card {
          width: 165px !important;
          min-width: 165px !important;
          max-width: 165px !important;
          height: 190px !important;
          padding: 8px !important;
          background: #ffffff !important;
          border: 1px solid #d4d4d4 !important;
          box-shadow: 0px 4px 4px #001b7d !important;
          border-radius: 5px !important;
          margin: 0 !important;
          box-sizing: border-box !important;
          display: flex !important;
          flex-direction: column !important;
        }

        .food-photo {
          width: 100% !important;
          height: 95px !important;
          margin-bottom: 6px !important;
        }

        .food-name {
          font-size: 13px !important;
          line-height: 16px !important;
          margin: 0 0 2px 0 !important;
        }

        .food-location {
          font-size: 7px !important;
          line-height: 9px !important;
          margin-bottom: 4px !important;
        }

        .food-location iconify-icon {
          font-size: 12px !important;
        }

        .food-meta {
          font-size: 10px !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- PEMGILIK NAVBAR HTML OTOMATIS -->
    <div id="navbar-container"></div>

    <main class="page-container" style="padding-top: 130px">
      <!-- Judul Halaman -->
      <h1 class="page-title" style="text-align: center; font-style: italic; font-weight: 500; font-size: 18px; color: #000000; margin-bottom: 24px">Kuliner Tersimpan</h1>

      <!-- 1. Kondisi Kosong -->
      <div id="emptyState" class="state-container" style="display: none">
        <div class="state-text">Belum ada kuliner yang tersimpan</div>
      </div>

      <!-- 2. Kondisi Gagal Dimuat -->
      <div id="errorState" class="state-container" style="display: none">
        <div class="state-text">Gagal memuat daftar kuliner tersimpan, silahkan <button id="retryBtn" class="state-retry-btn">Coba Lagi</button></div>
      </div>

      <!-- 3. Daftar Kartu Kuliner Tersimpan -->
      <div id="savedGrid" class="saved-grid" style="display: none"></div>
    </main>

    <!-- SCRIPT NAVBAR & LOGIKA UTAMA -->
    <script src="js/navbar.js"></script>
    <script>
      const BASE_URL = "http://localhost/ABIG-Anak-Buah-Ibu-Ghina-/backend";

      document.addEventListener("DOMContentLoaded", () => {
        loadSavedFoods();

        document.getElementById("retryBtn").addEventListener("click", () => {
          loadSavedFoods();
        });
      });

      async function loadSavedFoods() {
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const savedGrid = document.getElementById("savedGrid");

        emptyState.style.display = "none";
        errorState.style.display = "none";
        savedGrid.style.display = "none";

        try {
          const response = await fetch(`${BASE_URL}/api/favorit.php`, {
            method: "GET",
            credentials: "include",
          });

          if (response.status === 401) {
            window.location.href = "login.html";
            return;
          }

          if (!response.ok) throw new Error("Gagal mengambil data dari server");

          const result = await response.json();

          if (!result.status) {
            errorState.style.display = "flex";
            return;
          }

          const data = result.data || [];

          if (data.length === 0) {
            emptyState.style.display = "flex";
            return;
          }

          renderSavedCards(data);
          savedGrid.style.display = "flex";
        } catch (err) {
          console.error("Gagal memuat kuliner tersimpan:", err);
          errorState.style.display = "flex";
        }
      }

      function renderSavedCards(items) {
        const savedGrid = document.getElementById("savedGrid");

        savedGrid.innerHTML = items
          .map((item) => {
            // Menyamakan sumber foto agar mengambil foto kuliner/makanan terlebih dahulu seperti di index.html
            const rawPhoto = item.foto_kuliner || item.foto_makanan || item.foto || "";
            const photo = getSafePhoto(rawPhoto);

            const name = escapeHTML(item.nama_kuliner || item.nama || "Nama kuliner");
            const place = escapeHTML(item.nama_tempat || "Tempat belum tersedia");
            const address = escapeHTML(item.alamat || "Alamat belum tersedia");

            const numericPrice = Number(item.harga);
            const price = Number.isFinite(numericPrice) ? numericPrice.toLocaleString("id-ID") : "0";

            // Mengambil rating rata-rata dari API favorit.php yang sudah dinamis
            const ratingNum = Number(item.rata_rata_rating || 0).toFixed(1);

            const dataQuery = new URLSearchParams({
              id: item.id_tempat || item.id_kuliner || "",
              nama: item.nama_kuliner || item.nama_tempat || "Kuliner",
              deskripsi: item.deskripsi || "Deskripsi belum tersedia.",
              foto: photo,
              harga: item.harga || "0",
              alamat: `${item.nama_tempat ? item.nama_tempat + " — " : ""}${item.alamat || "Alamat tidak tersedia"}`,
              jam: item.jam_buka && item.jam_tutup ? `${item.jam_buka.substring(0, 5)} - ${item.jam_tutup.substring(0, 5)}` : "09:00 - 21:00",
              lat: item.latitude || "",
              lng: item.longitude || "",
              no_telepon: item.no_telepon || "",
            }).toString();

            return `
            <a href="detail_kuliner.html?${dataQuery}" class="food-card" style="text-decoration: none; color: inherit; cursor: pointer; display: flex; flex-direction: column;">
              <img class="food-photo" src="${photo}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e0e0e0/555555?text=Kuliner'" />
              <h3 class="food-name">${name}</h3>
              <div class="food-location">
                <iconify-icon icon="material-symbols:location-on" aria-hidden="true"></iconify-icon>
                <span>${place} — ${address}</span>
              </div>
              <div class="food-meta">
                <span>Rp. ${price}</span>
                <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; color: #333333;">
                  <iconify-icon icon="material-symbols:star" style="color: #FFBF00; font-size: 18px;"></iconify-icon>
                  <span>${ratingNum}</span>
                </div>
              </div>
            </a>
          `;
          })
          .join("");
      }

      function getSafePhoto(value) {
        const photo = String(value || "").trim();
        if (!photo) return "https://placehold.co/400x300/e0e0e0/555555?text=Kuliner";

        if (/^(https?:\/\/)/i.test(photo) && !/^javascript:/i.test(photo)) {
          return escapeHTML(photo);
        }

        if (photo.startsWith("/")) {
          return escapeHTML(photo);
        }

        return escapeHTML(`${BASE_URL}/uploads/${photo.replace(/^uploads\//, "")}`);
      }

      function escapeHTML(value) {
        return String(value || "").replace(/[&<>"']/g, (character) => {
          const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
          return entities[character];
        });
      }
    </script>
  </body>
</html>
