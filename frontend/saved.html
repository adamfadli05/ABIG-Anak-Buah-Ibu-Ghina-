<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuliner Tersimpan | Mangan Yukkk</title>

    <!-- CSS Utama -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css?v=4" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,500&display=swap" rel="stylesheet" />

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js" defer></script>

    <style>
      :root {
        --primary: #001b7d;
        --border: #d9dce5;
        --text: #34343a;
        --muted: #6c6c73;
        --placeholder: #dedede;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: var(--text);
        font-family: "Inter", sans-serif;
        font-size: 14px;
      }

      /* CONTAINER HALAMAN DESKTOP */
      .page-container {
        width: 100% !important;
        max-width: 1340px !important;
        min-height: 100vh !important;
        margin: 0 auto !important;
        padding: 24px 32px 50px !important;
        padding-top: 130px !important;
        box-sizing: border-box !important;
        background: #ffffff !important;
        position: relative !important;
      }

      /* TAMPILAN PESAN KOSONG / ERROR */
      .state-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        margin-top: 40px;
        text-align: center;
        font-family: "Inter", sans-serif;
      }

      .state-text {
        font-style: normal;
        font-weight: 400;
        font-size: 14px;
        line-height: 17px;
        color: #000000;
      }

      .state-retry-btn {
        background: none;
        border: none;
        font-family: "Inter", sans-serif;
        font-style: normal;
        font-weight: 400;
        font-size: 14px;
        line-height: 17px;
        color: #001b7d;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
        display: inline;
      }

      .state-retry-btn:hover {
        opacity: 0.8;
      }

      .saved-page-heading {
        display: contents;
      }

      .saved-page-back,
      .saved-state-icon,
      .state-description {
        display: none;
      }

      /* ==========================================================================
         STYLING PAGINATION (DISAMAKAN DENGAN INDEX)
         ========================================================================== */
      .pagination-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 30px;
      }

      .pagination-arrow {
        background-color: #ffffff;
        color: #001b7d;
        border: 1px solid #001b7d;
        width: 24px;
        height: 24px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .pagination-arrow:hover,
      .pagination-arrow:active {
        background-color: #001b7d;
        color: #ffffff;
      }

      .pagination-arrow:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        background-color: #ffffff;
        color: #001b7d;
      }

      .pagination-number {
        background: none;
        border: none;
        font-family: "Inter", sans-serif;
        font-size: 16px;
        font-weight: 500;
        color: rgba(0, 0, 0, 0.5);
        cursor: pointer;
        padding: 2px 4px;
        transition: all 0.2s ease;
      }

      .pagination-number:hover {
        color: #001b7d;
      }

      .pagination-number.active {
        color: #001b7d !important;
        font-weight: 700 !important;
      }

      /* ==========================================================================
         GRID KARTU KULINER (DISAMAKAN DENGAN INDEX.HTML)
         ========================================================================== */
      .saved-grid {
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 20px !important;
        justify-content: flex-start !important;
        width: 100% !important;
        max-width: 1340px !important;
        margin: 0 auto !important;
      }

      .food-card {
        width: calc(25% - 15px) !important;
        min-width: 250px !important;
        max-width: 320px !important;
        min-height: 360px !important;
        padding: 12px !important;
        background: #ffffff !important;
        border: 1px solid #d4d4d4 !important;
        box-shadow: 0px 4px 4px #001b7d !important;
        border-radius: 5px !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        margin: 0 !important;
        border-bottom: 3px solid var(--primary);
        cursor: pointer;
        position: relative;
        text-decoration: none;
        color: inherit;
      }

      .food-photo {
        width: 100% !important;
        height: 190px !important;
        object-fit: cover !important;
        border-radius: 5px !important;
        display: block !important;
        margin-bottom: 8px !important;
      }

      .food-name {
        font-family: "Inter" !important;
        font-weight: 400 !important;
        font-size: 15px !important;
        line-height: 18px !important;
        text-align: left !important;
        color: #000000 !important;
        margin: 0 0 6px 0 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      .food-location {
        display: flex !important;
        align-items: flex-start !important;
        gap: 4px !important;
        color: #000000 !important;
        font-size: 12px !important;
        line-height: 15px !important;
        margin-bottom: 8px !important;
      }

      .food-location span {
        display: -webkit-box !important;
        -webkit-line-clamp: 2 !important;
        -webkit-box-orient: vertical !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      .food-location iconify-icon {
        font-size: 20px !important;
        color: #938f99 !important;
        flex-shrink: 0 !important;
      }

      .food-meta {
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        margin-top: auto !important;
        font-family: "Inter" !important;
        font-size: 16px !important;
        font-weight: 400 !important;
        color: #000000 !important;
      }

      /* ==========================================================================
         RESPONSIVE MOBILE
         ========================================================================== */
      @media (max-width: 480px) {
        .page-container {
          width: 100% !important;
          max-width: 402px !important;
          margin: 0 auto !important;
          padding: 12px 16px !important;
          padding-top: 95px !important;
        }

        .saved-page-heading {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 16px;
        }

        .saved-page-back {
          display: grid;
          width: 22px;
          height: 22px;
          flex: 0 0 22px;
          place-items: center;
          border-radius: 50%;
          background: var(--primary);
          color: #ffffff;
          text-decoration: none;
        }

        .saved-page-back iconify-icon {
          font-size: 19px;
        }

        .page-title {
          margin: 0 !important;
          color: #000000 !important;
          font-size: 12px !important;
          font-style: normal !important;
          font-weight: 400 !important;
          text-align: left !important;
          text-decoration: underline;
        }

        .saved-grid {
          display: grid !important;
          grid-template-columns: repeat(2, 165px) !important;
          justify-content: center !important;
          gap: 16px !important;
          padding: 0 !important;
          width: 100% !important;
          margin: 0 auto !important;
        }

        .food-card {
          width: 165px !important;
          min-width: 165px !important;
          max-width: 165px !important;
          height: 190px !important;
          min-height: 0 !important;
          padding: 8px !important;
          background: #ffffff !important;
          border: 1px solid #d4d4d4 !important;
          box-shadow: 0px 4px 4px #001b7d !important;
          border-radius: 5px !important;
          margin: 0 !important;
          box-sizing: border-box !important;
          display: flex !important;
          flex-direction: column !important;
        }

        .food-photo {
          width: 100% !important;
          height: 95px !important;
          margin-bottom: 6px !important;
        }

        .food-name {
          font-size: 10px !important;
          line-height: 12px !important;
          margin: 0 0 2px 0 !important;
        }

        .food-location {
          font-size: 7px !important;
          line-height: 9px !important;
          margin-bottom: 4px !important;
        }

        .food-location iconify-icon {
          font-size: 12px !important;
        }

        .food-meta {
          font-size: 10px !important;
        }

        .food-meta > div {
          font-size: 10px !important;
        }

        .food-meta > div iconify-icon {
          font-size: 14px !important;
        }

        .state-container {
          gap: 6px;
          margin-top: 16px;
        }

        .saved-state-icon {
          display: block;
          width: 26px;
          height: 26px;
          color: #858585;
          flex: 0 0 auto;
        }

        .state-text {
          max-width: 190px;
          font-size: 8px;
          line-height: 1.35;
        }

        .empty-state-copy {
          display: grid;
          justify-items: center;
          gap: 3px;
        }

        .state-description {
          display: block;
          max-width: 190px;
          margin: 0;
          color: #34343a;
          font-size: 7px;
          line-height: 1.35;
        }

        .state-retry-btn {
          font-size: inherit;
          line-height: inherit;
        }
      }
    </style>
  </head>
  <body>
    <!-- PEMGILIK NAVBAR HTML OTOMATIS -->
    <div id="navbar-container"></div>

    <main class="page-container" style="padding-top: 130px">
      <!-- Judul Halaman -->
      <div class="saved-page-heading">
        <a class="saved-page-back" href="profile.html" aria-label="Kembali ke profil">
          <iconify-icon icon="mdi:chevron-left" aria-hidden="true"></iconify-icon>
        </a>
        <h1 class="page-title" style="text-align: center; font-style: italic; font-weight: 500; font-size: 18px; color: #000000; margin-bottom: 24px">Kuliner Tersimpan</h1>
      </div>

      <!-- 1. Kondisi Kosong -->
      <div id="emptyState" class="state-container" style="display: none">
        <svg class="saved-state-icon empty-state-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M6 3h12v18l-6-4-6 4z"></path>
          <path d="m9 8 6 6m0-6-6 6" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="1.8"></path>
        </svg>
        <div class="empty-state-copy">
          <div class="state-text">Belum ada kuliner yang tersimpan.</div>
          <p class="state-description">Yukkk, temukan dan simpan kuliner favoritmu!</p>
        </div>
      </div>

      <!-- 2. Kondisi Gagal Dimuat / Koneksi Terputus -->
      <div id="errorState" class="state-container" style="display: none">
        <iconify-icon class="saved-state-icon error-state-icon" icon="fluent:wifi-warning-20-filled" aria-hidden="true"></iconify-icon>
        <div id="errorMessageText" class="state-text">Gagal memuat daftar kuliner tersimpan, silahkan <button id="retryBtn" class="state-retry-btn">Coba Lagi</button></div>
      </div>

      <!-- 3. Daftar Kartu Kuliner Tersimpan -->
      <div id="savedGrid" class="saved-grid" style="display: none"></div>

      <!-- 4. Navigasi Pagination -->
      <div id="paginationContainer" class="pagination-container" style="display: none"></div>
    </main>

    <!-- SCRIPT NAVBAR & LOGIKA UTAMA -->
    <script src="js/env.js"></script>
    <script src="js/config.js"></script>
    <script src="js/navbar.js?v=mobile-nav-1"></script>
    <script>
      window.allSavedKuliner = [];
      window.currentPage = 1;
      window.itemsPerPage = 20;
      let totalSavedPages = 1;
      const SAVED_CACHE_KEY = "mangan_yukk_saved_cache_v1";
      const savedPageCache = new Map();

      document.addEventListener("DOMContentLoaded", () => {
        loadSavedFoods(1, false);

        window.addEventListener("offline", () => {
          showConnectionLostState();
        });

        window.addEventListener("online", () => {
          loadSavedFoods(window.currentPage, true);
        });
      });

      function bindRetryButton() {
        const retryBtn = document.getElementById("retryBtn");
        if (retryBtn) {
          retryBtn.onclick = () => loadSavedFoods(window.currentPage, true);
        }
      }

      function showConnectionLostState() {
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessageText = document.getElementById("errorMessageText");
        const savedGrid = document.getElementById("savedGrid");
        const paginationContainer = document.getElementById("paginationContainer");

        if (emptyState) emptyState.style.display = "none";
        if (savedGrid) {
          savedGrid.style.display = "none";
          savedGrid.innerHTML = "";
        }
        if (paginationContainer) {
          paginationContainer.innerHTML = "";
          paginationContainer.style.display = "none";
        }
        if (errorMessageText) {
          errorMessageText.innerHTML = `Koneksi internet terputus, silahkan <button id="retryBtn" class="state-retry-btn">Coba Lagi</button>`;
          bindRetryButton();
        }
        if (errorState) errorState.style.display = "flex";
      }

      function showLoadErrorState() {
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const errorMessageText = document.getElementById("errorMessageText");
        const savedGrid = document.getElementById("savedGrid");
        const paginationContainer = document.getElementById("paginationContainer");

        if (emptyState) emptyState.style.display = "none";
        if (savedGrid) {
          savedGrid.style.display = "none";
          savedGrid.innerHTML = "";
        }
        if (paginationContainer) {
          paginationContainer.innerHTML = "";
          paginationContainer.style.display = "none";
        }
        if (errorMessageText) {
          errorMessageText.innerHTML = `Gagal memuat daftar kuliner tersimpan, silahkan <button id="retryBtn" class="state-retry-btn">Coba Lagi</button>`;
          bindRetryButton();
        }
        if (errorState) errorState.style.display = "flex";
      }

      function readSavedCache() {
        try {
          const raw = localStorage.getItem(SAVED_CACHE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            return { items: parsed, totalPages: Math.max(1, Math.ceil(parsed.length / window.itemsPerPage)) };
          }
          if (parsed && Array.isArray(parsed.items)) {
            return {
              items: parsed.items,
              totalPages: Math.max(1, Number(parsed.totalPages) || 1),
            };
          }
          return null;
        } catch (_) {
          return null;
        }
      }

      function writeSavedCache(items, totalPages = 1) {
        try {
          localStorage.setItem(
            SAVED_CACHE_KEY,
            JSON.stringify({ items, totalPages: Math.max(1, Number(totalPages) || 1) })
          );
        } catch (_) {}
      }

      function renderSavedPage(list, page = 1, totalPages = 1) {
        const emptyState = document.getElementById("emptyState");
        const errorState = document.getElementById("errorState");
        const savedGrid = document.getElementById("savedGrid");
        const paginationContainer = document.getElementById("paginationContainer");

        if (errorState) errorState.style.display = "none";
        window.allSavedKuliner = Array.isArray(list) ? list : [];
        window.currentPage = Math.max(1, Number(page) || 1);
        totalSavedPages = Math.max(1, Number(totalPages) || 1);

        if (window.allSavedKuliner.length === 0) {
          savedGrid.style.display = "none";
          savedGrid.innerHTML = "";
          if (paginationContainer) {
            paginationContainer.innerHTML = "";
            paginationContainer.style.display = "none";
          }
          emptyState.style.display = "flex";
          return;
        }

        emptyState.style.display = "none";
        const fragment = document.createDocumentFragment();
        const tempWrapper = document.createElement("div");
        tempWrapper.innerHTML = window.allSavedKuliner.map(renderFoodCard).join("");
        while (tempWrapper.firstChild) {
          fragment.appendChild(tempWrapper.firstChild);
        }
        savedGrid.replaceChildren(fragment);
        savedGrid.style.display = "flex";

        renderPaginationControls(totalSavedPages);
      }

      async function loadSavedFoods(page = 1, forceNoCache = false) {
        const targetPage = Math.max(1, Number(page) || 1);
        window.currentPage = targetPage;

        if (!navigator.onLine) {
          showConnectionLostState();
          return;
        }

        const memCached = !forceNoCache ? savedPageCache.get(targetPage) : null;
        const localPage1 =
          targetPage === 1 && !forceNoCache && !memCached ? readSavedCache() : null;
        const initial = memCached || localPage1;

        if (initial && Array.isArray(initial.items) && initial.items.length > 0) {
          renderSavedPage(initial.items, targetPage, initial.totalPages);
        }

        try {
          const query = new URLSearchParams({
            page: String(targetPage),
            limit: String(window.itemsPerPage),
          }).toString();

          const response = await fetch(`${BASE_URL}/api/favorit.php?${query}`, {
            method: "GET",
            credentials: "include",
          });

          if (response.status === 401) {
            localStorage.removeItem(SAVED_CACHE_KEY);
            window.location.href = "login.html";
            return;
          }

          if (!response.ok) throw new Error("Gagal mengambil data dari server");

          const result = await response.json();

          if (!result.status) {
            if (!initial || !initial.items?.length) {
              showLoadErrorState();
            }
            return;
          }

          const freshList = Array.isArray(result.data) ? result.data : [];
          const pagination = result.pagination || {};
          const computedPages =
            Number(pagination.total_pages) ||
            (Number(pagination.total_data) > 0
              ? Math.ceil(Number(pagination.total_data) / window.itemsPerPage)
              : Math.max(1, Math.ceil(freshList.length / window.itemsPerPage)));

          const pageObj = {
            items: freshList,
            totalPages: Math.max(1, computedPages),
          };
          savedPageCache.set(targetPage, pageObj);
          if (targetPage === 1) {
            writeSavedCache(freshList, pageObj.totalPages);
          }

          renderSavedPage(freshList, Number(pagination.current_page) || targetPage, pageObj.totalPages);
        } catch (err) {
          console.error("Gagal memuat kuliner tersimpan:", err);
          if (!navigator.onLine || err instanceof TypeError) {
            showConnectionLostState();
          } else if (!initial || !initial.items?.length) {
            showLoadErrorState();
          }
        }
      }

      function renderPaginationControls(totalPagesInput = totalSavedPages) {
        const paginationContainer = document.getElementById("paginationContainer");
        if (!paginationContainer) return;

        const totalPages = Math.max(1, Number(totalPagesInput) || 1);
        if (totalPages <= 1 && window.matchMedia("(max-width: 480px)").matches) {
          paginationContainer.innerHTML = "";
          paginationContainer.style.display = "none";
          return;
        }
        paginationContainer.style.display = "flex";

        let html = `
          <button class="pagination-arrow" onclick="changePage(${window.currentPage - 1})" ${window.currentPage === 1 ? "disabled" : ""}>
            <iconify-icon icon="mdi:chevron-left" style="font-size: 14px; display: flex; align-items: center; justify-content: center;"></iconify-icon>
          </button>
        `;

        const mobilePages =
          totalPages > 5 && window.matchMedia("(max-width: 480px)").matches
            ? [...new Set([1, window.currentPage - 1, window.currentPage, window.currentPage + 1, totalPages])]
                .filter((page) => page >= 1 && page <= totalPages)
                .sort((a, b) => a - b)
            : null;

        if (mobilePages) {
          mobilePages.forEach((page, index) => {
            if (index > 0 && page - mobilePages[index - 1] > 1) {
              html += `<span style="padding: 0 4px; color: rgba(0, 0, 0, 0.5); font-weight: 500; font-size: 16px;">...</span>`;
            }

            html += `
              <button class="pagination-number ${page === window.currentPage ? "active" : ""}" onclick="changePage(${page})">
                ${page}
              </button>
            `;
          });
        } else {
          for (let page = 1; page <= totalPages; page++) {
            html += `
              <button class="pagination-number ${page === window.currentPage ? "active" : ""}" onclick="changePage(${page})">
                ${page}
              </button>
            `;
          }
        }

        html += `
          <button class="pagination-arrow" onclick="changePage(${window.currentPage + 1})" ${window.currentPage === totalPages ? "disabled" : ""}>
            <iconify-icon icon="mdi:chevron-right" style="font-size: 14px; display: flex; align-items: center; justify-content: center;"></iconify-icon>
          </button>
        `;

        paginationContainer.innerHTML = html;
      }

      function changePage(page) {
        if (!navigator.onLine) {
          showConnectionLostState();
          return;
        }
        const target = Number(page);
        if (target < 1 || target > totalSavedPages) return;
        loadSavedFoods(target, false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderFoodCard(item) {
        const rawPhoto = item.foto_makanan || item.foto_kuliner || item.foto || "";
        const photo = getSafePhoto(rawPhoto);

        const name = escapeHTML(item.nama_kuliner || item.nama || "Nama kuliner");
        const place = escapeHTML(item.nama_tempat || "Tempat belum tersedia");
        const address = escapeHTML(item.alamat || "Alamat belum tersedia");

        const numericPrice = Number(item.harga);
        const price = Number.isFinite(numericPrice) ? numericPrice.toLocaleString("id-ID") : "0";
        const ratingNum = Number(item.rata_rata_rating || 0).toFixed(1);

        const dataQuery = new URLSearchParams({
          id: item.id_tempat || item.id_kuliner || "",
          nama: item.nama_kuliner || item.nama_tempat || "Kuliner",
          deskripsi: item.deskripsi || "Deskripsi belum tersedia.",
          foto: photo,
          harga: item.harga || "0",
          alamat: `${item.nama_tempat ? item.nama_tempat + " — " : ""}${item.alamat || "Alamat tidak tersedia"}`,
          jam: item.jam_buka && item.jam_tutup ? `${item.jam_buka.substring(0, 5)} - ${item.jam_tutup.substring(0, 5)}` : "09:00 - 21:00",
          lat: item.latitude || "",
          lng: item.longitude || "",
          no_telepon: item.no_telepon || "",
        }).toString();

        return `
          <a href="detail_kuliner.html?${dataQuery}" class="food-card" style="text-decoration: none; color: inherit; cursor: pointer; display: flex; flex-direction: column;">
            <img class="food-photo" src="${photo}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e0e0e0/555555?text=Kuliner'" />
            <h3 class="food-name">${name}</h3>
            <div class="food-location">
              <iconify-icon icon="material-symbols:location-on" aria-hidden="true"></iconify-icon>
              <span>${place} — ${address}</span>
            </div>
            <div class="food-meta">
              <span>Rp. ${price}</span>
              <div style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; color: #333333;">
                <iconify-icon icon="material-symbols:star" style="color: #FFBF00; font-size: 18px;"></iconify-icon>
                <span>${ratingNum}</span>
              </div>
            </div>
          </a>
        `;
      }

      function getSafePhoto(value) {
        const photo = String(value || "").trim();
        if (!photo) return "https://placehold.co/400x300/e0e0e0/555555?text=Kuliner";

        if (/^(https?:\/\/)/i.test(photo) && !/^javascript:/i.test(photo)) {
          return escapeHTML(photo);
        }

        if (photo.startsWith("/")) {
          return escapeHTML(photo);
        }

        return escapeHTML(`${BASE_URL}/uploads/${photo.replace(/^uploads\//, "")}`);
      }

      function escapeHTML(value) {
        return String(value || "").replace(/[&<>"']/g, (character) => {
          const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
          return entities[character];
        });
      }
    </script>
  </body>
