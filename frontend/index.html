    <!-- CSS Utama -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Iconify & SweetAlert2 -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <!-- Modal Pop-up Google Login -->
    <div id="responseModal" class="modal-overlay" style="display: none">
      <div class="modal-card-custom">
        <div id="modalIcon" class="modal-icon-container"></div>
        <p id="modalMessage" class="modal-text"></p>
        <div id="modalActions" class="modal-actions-custom">
          <button type="button" id="modalCloseBtn">Oke</button>
        </div>
      </div>
    </div>

    <main class="page-container">
      <p class="page-caption" style="text-align: center; color: #666; margin-bottom: 12px">Kuliner Khas Cirebon</p>

      <!-- Google Maps -->
      <section class="map-banner" aria-label="Peta kuliner">
        <div id="map"></div>
      </section>

      <!-- Pencarian Kuliner -->
      <section class="search-section" aria-label="Pencarian kuliner">
        <div class="search-box">
          <iconify-icon icon="lucide:search" class="search-icon"></iconify-icon>
          <input type="search" id="searchInput" placeholder="Cari" aria-label="Cari kuliner atau tempat" autocomplete="off" />
        </div>
      </section>

      <!-- Kategori Kuliner -->
      <section class="category-section" aria-label="Kategori makanan">
        <div class="category-list" id="categoryList">
          <button type="button" class="category-btn active" data-category="semua">semua</button>
          <button type="button" class="category-btn" data-category="camilan">camilan</button>
          <button type="button" class="category-btn" data-category="makanan berat">makanan berat</button>
          <button type="button" class="category-btn" data-category="minuman">minuman</button>
        </div>
      </section>

      <!-- Daftar Kuliner -->
      <section class="food-grid" id="foodGrid" aria-label="Daftar kuliner"></section>

      <!-- Pesan Jika Data Kosong -->
      <p id="emptyMessage" class="empty-message" style="display: none; text-align: center; padding: 20px; color: #666">Kuliner untuk pencarian atau kategori ini belum tersedia.</p>
    </main>

    <!-- File JavaScript External -->
    <script src="js/navbar.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <script>
      const BASE_URL = "http://localhost/ABIG-Anak-Buah-Ibu-Ghina-/backend";

      window.map = null;
      window.markers = [];
      window.allKuliner = [];
      window.selectedCategory = "semua";

     // FUNGSI TUNGGAL ERROR MAPS DENGAN WARNA FIGMA (#D9D9D9 & #D4D4D4)
      function renderMapErrorUI() {
        const mapElement = document.getElementById("map");
        if (!mapElement) return;

        mapElement.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; background-color: #D9D9D9; border: 1.5px dashed #D4D4D4; border-radius: 12px; color: #001b7d; padding: 20px; box-sizing: border-box; text-align: center;">
            <h4 style="margin: 0 0 8px 0; font-size: 16px; font-weight: 700; color: #001b7d;">Gagal Memuat Peta</h4>
            <button onclick="window.location.reload()" style="background: transparent; border: none; color: #333; font-size: 14px; font-weight: 400; text-decoration: underline; cursor: pointer; padding: 0; outline: none;">coba lagi</button>
          </div>
        `;
      }

      // HANDLER ERROR GOOGLE MAPS
      window.gm_authFailure = function () {
        renderMapErrorUI();
      };

      window.addEventListener("offline", () => {
        renderMapErrorUI();
      });

      window.addEventListener("online", () => {
        if (typeof window.initMap === "function") {
          window.initMap();
        }
      });

      // INITIALIZE GOOGLE MAPS WITH VALIDATION
      window.initMap = function () {
        const mapElement = document.getElementById("map");
        if (!mapElement) return;

        if (!navigator.onLine) {
          renderMapErrorUI();
          return;
        }

        if (!window.google || !window.google.maps) {
          renderMapErrorUI();
          return;
        }

        try {
          const cirebon = { lat: -6.732, lng: 108.552 };
          window.map = new google.maps.Map(mapElement, {
            zoom: 13,
            center: cirebon,
            disableDefaultUI: false,
            zoomControl: true,
          });
          loadKulinerMarkers();
        } catch (error) {
          console.error("Gagal inisialisasi Peta:", error);
          renderMapErrorUI();
        }
      };

     // 2. MARKER LOKASI MAPS (POPUP RINGKAS TANPA SCROLLBAR)
      async function loadKulinerMarkers() {
        if (!window.map || !window.google?.maps) return;
        try {
          // Ambil data tempat dan data kuliner secara bersamaan untuk mengambil foto
          const [resTempat, resKuliner] = await Promise.all([
            fetch(`${BASE_URL}/api/tempat_kuliner.php`),
            fetch(`${BASE_URL}/api/kuliner.php`)
          ]);

          if (!resTempat.ok || !resKuliner.ok) return;

          const jsonTempat = await resTempat.json();
          const jsonKuliner = await resKuliner.json();

          if (!jsonTempat.status || !Array.isArray(jsonTempat.data)) return;
          if (!jsonKuliner.status || !Array.isArray(jsonKuliner.data)) return;

          // Buat Map untuk mencocokkan id_kuliner
          const kulinerMap = new Map();
          jsonKuliner.data.forEach((k) => {
            kulinerMap.set(String(k.id_kuliner), k);
          });

          const infoWindow = new google.maps.InfoWindow();

          jsonTempat.data.forEach((item) => {
            const lat = Number(item.latitude);
            const lng = Number(item.longitude);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

            const detailKuliner = kulinerMap.get(String(item.id_kuliner)) || {};
            const photoUrl = getSafePhoto(detailKuliner.foto || item.foto);

            const marker = new google.maps.Marker({
              position: { lat, lng },
              map: window.map,
              title: item.nama_tempat || item.nama_kuliner || "Kuliner",
            });

         marker.addListener("click", () => {
              const content = document.createElement("div");
              // Kunci ukuran secara ketat
              content.style.width = "180px";
              content.style.height = "auto";
              content.style.padding = "0";
              content.style.margin = "0";
              content.style.overflow = "hidden";
              content.style.boxSizing = "border-box";

              const namaTempat = item.nama_tempat || "Tempat kuliner";
              const namaKuliner = item.nama_kuliner || detailKuliner.nama_kuliner || "-";
              const alamat = item.alamat || "-";

              content.innerHTML = `
                <!-- Foto 65px agar spasi ke bawah sangat aman -->
                <img src="${photoUrl}" alt="${namaKuliner}" style="width: 100%; height: 65px; object-fit: cover; border-radius: 6px; margin-bottom: 4px; display: block;" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e0e0e0/555555?text=Kuliner'" />
                
                <h4 style="margin: 0 0 2px 0; font-size: 11px; font-weight: 700; color: #001b7d; line-height: 1.2;">${namaTempat}</h4>
                <p style="margin: 0 0 3px 0; font-size: 9.5px; font-weight: 500; color: #333; line-height: 1.1;">Menu: ${namaKuliner}</p>
                <p style="margin: 0; font-size: 8.5px; color: #666; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${alamat}</p>
              `;
              infoWindow.setContent(content);
              infoWindow.open(window.map, marker);
            });

            window.markers.push(marker);
          });
        } catch (error) {
          console.error("Gagal memuat titik lokasi kuliner:", error);
        }
      }

      // 3. LOAD KULINER CARD
      async function loadKuliner() {
        const foodGrid = document.getElementById("foodGrid");
        const emptyMessage = document.getElementById("emptyMessage");
        if (foodGrid) foodGrid.setAttribute("aria-busy", "true");
        try {
          // Mengambil data dari kedua endpoint secara bersamaan
          const [resTempat, resKuliner] = await Promise.all([
            fetch(`${BASE_URL}/api/tempat_kuliner.php`),
            fetch(`${BASE_URL}/api/kuliner.php`)
          ]);

          if (!resTempat.ok || !resKuliner.ok) throw new Error("Gagal mengambil data dari server.");

          const jsonTempat = await resTempat.json();
          const jsonKuliner = await resKuliner.json();

          if (!jsonTempat.status || !Array.isArray(jsonTempat.data)) throw new Error("Format data tempat kuliner tidak sesuai.");
          if (!jsonKuliner.status || !Array.isArray(jsonKuliner.data)) throw new Error("Format data kuliner tidak sesuai.");

          // Membuat map untuk data kuliner berdasarkan id_kuliner agar mudah digabungkan
          const kulinerMap = new Map();
          jsonKuliner.data.forEach((k) => {
            kulinerMap.set(String(k.id_kuliner), k);
          });

          // Menggabungkan data tempat dan kuliner secara lengkap
          window.allKuliner = jsonTempat.data.map((item) => {
            const detailKuliner = kulinerMap.get(String(item.id_kuliner)) || {};
            return {
              ...item,
              nama_kuliner: item.nama_kuliner || detailKuliner.nama_kuliner || detailKuliner.nama || "",
              kategori: detailKuliner.kategori || detailKuliner.nama_kategori || item.kategori || "", // Bawa data kategori
              deskripsi: detailKuliner.deskripsi || "",
              foto: detailKuliner.foto || "",
            };
          });

          renderKuliner();
        } catch (error) {
          console.error("Gagal memuat data kuliner:", error);
          if (foodGrid) {
            foodGrid.innerHTML = "";
            foodGrid.style.display = "none";
          }
          if (emptyMessage) {
            emptyMessage.textContent = "Data kuliner gagal dimuat. Periksa koneksi backend.";
            emptyMessage.style.display = "block";
          }
        } finally {
          if (foodGrid) foodGrid.setAttribute("aria-busy", "false");
        }
      }

    function renderKuliner() {
        const foodGrid = document.getElementById("foodGrid");
        const emptyMessage = document.getElementById("emptyMessage");
        const searchInput = document.getElementById("searchInput");
        if (!foodGrid) return;

        const keyword = searchInput ? searchInput.value.trim().toLocaleLowerCase("id-ID") : "";
        const selectedCat = (window.selectedCategory || "semua").trim().toLowerCase();

        const filteredKuliner = window.allKuliner.filter((item) => {
          // Mengambil nilai kategori dari berbagai kemungkinan properti dari BE
          const rawCategory = item.kategori || item.nama_kategori || item.kategori_kuliner || item.jenis || "";
          const category = String(rawCategory).trim().toLowerCase();

          const name = String(item.nama_kuliner || item.nama || "").toLowerCase();
          const place = String(item.nama_tempat || "").toLowerCase();
          const address = String(item.alamat || "").toLowerCase();
          const description = String(item.deskripsi || "").toLowerCase();

          // Logika pencocokan kategori & kata kunci pencarian
          const matchesCategory = selectedCat === "semua" || category === selectedCat || category.includes(selectedCat);
          const matchesSearch = !keyword || name.includes(keyword) || place.includes(keyword) || address.includes(keyword) || description.includes(keyword);

          return matchesCategory && matchesSearch;
        });

       // VALIDASI JIKA KULINER TIDAK DITEMUKAN (TANPA IKON MUTER)
        if (filteredKuliner.length === 0) {
          foodGrid.innerHTML = "";
          foodGrid.style.display = "none";
          if (emptyMessage) {
            emptyMessage.innerHTML = `
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 40px 0; gap: 8px; font-family: 'Inter', sans-serif;">
                <span style="color: #001b7d; font-size: 15px; font-weight: 500; font-family: 'Inter', sans-serif;">Kuliner tidak ditemukan</span>
                <button onclick="window.location.reload()" style="background: transparent; border: none; color: #001b7d; font-size: 14px; font-weight: 400; font-family: 'Inter', sans-serif; cursor: pointer; outline: none; padding: 0;">
                  <span style="text-decoration: underline;">Coba Lagi</span>
                </button>
              </div>
            `;
            emptyMessage.style.display = "block";
          }
          return;
        }

        if (emptyMessage) emptyMessage.style.display = "none";

        // UBAH DARI "grid" MENJADI "flex" AGAR KARTU TIDAK RENGGANG
        foodGrid.style.display = "flex";

        foodGrid.innerHTML = filteredKuliner
          .map((item) => {
            const name = escapeHTML(item.nama_kuliner || item.nama || "Nama kuliner");
            const place = escapeHTML(item.nama_tempat || "Tempat belum tersedia");
            const address = escapeHTML(item.alamat || "Alamat belum tersedia");
            const description = escapeHTML(item.deskripsi || "");

            // Mengambil harga spesifik per tempat
            const numericPrice = Number(item.harga);
            const price = Number.isFinite(numericPrice) ? numericPrice.toLocaleString("id-ID") : "0";

            // Mengambil foto kuliner yang sudah digabung
            const photo = getSafePhoto(item.foto);

            return `
            <article class="food-card">
              <img class="food-photo" src="${photo}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e0e0e0/555555?text=Kuliner'" />
              <h3 class="food-name">${name}</h3>
              ${
                description
                  ? `<p class="food-description" style="font-size: 8px; color: #666; margin: 0 0 4px 0; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${description}</p>`
                  : ""
              }
              <div class="food-location">
                <iconify-icon icon="lucide:map-pin" aria-hidden="true"></iconify-icon>
                <span>${place} — ${address}</span>
              </div>
              <div class="food-meta">
                <span>Rp ${price}</span>
                <div style="display: flex; align-items: center; gap: 2px;">
                  <iconify-icon icon="material-symbols:star" style="color: #FFBF00; font-size: 14px;"></iconify-icon>
                  <span style="font-weight: 900; font-size: 10px;">3.5</span>
                </div>
              </div>
            </article>
          `;
          })
          .join("");
      }

      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
          return entities[character];
        });
      }

      function getSafePhoto(value) {
        const photo = String(value || "").trim();
        if (photo && /^(https?:\/\/|\/)/i.test(photo) && !/^javascript:/i.test(photo)) return escapeHTML(photo);
        return "https://placehold.co/400x300/e0e0e0/555555?text=Kuliner";
      }

      // 4. POPUP MODAL CONTROL
      function showPopupModal(isSuccess, message) {
        const modal = document.getElementById("responseModal");
        const modalIcon = document.getElementById("modalIcon");
        const modalMessage = document.getElementById("modalMessage");
        const mapEl = document.getElementById("map");

        if (!modal || !modalIcon || !modalMessage) return;

        if (isSuccess) {
          modalIcon.innerHTML = `<iconify-icon icon="mdi:check-circle" style="color:#28a745;font-size:39px; margin-bottom: 8px;"></iconify-icon>`;
        } else {
          modalIcon.innerHTML = `<iconify-icon icon="entypo:circle-with-cross" style="color:#ea3829;font-size:39px; margin-bottom: 8px;"></iconify-icon>`;
        }

        modalMessage.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
            <span style="color: #001b7d; font-family: 'Inter'; font-weight: 400; font-size: 16px; text-align: center; margin: 0;">${message || (isSuccess ? "Berhasil" : "Gagal, silahkan coba lagi")}</span>
          </div>
        `;

        if (mapEl) mapEl.style.visibility = "hidden";
        modal.classList.add("show");
      }

      // 5. PROCESS GOOGLE CALLBACK SAFELY
      async function checkGoogleLoginSession() {
        const urlParams = new URLSearchParams(window.location.search);
        const googleStatus = urlParams.get("google");
        const googleType = urlParams.get("type");
        const userDataRaw = urlParams.get("user");
        const role = urlParams.get("role") || "user";

        if (googleStatus === "success") {
          if (userDataRaw) {
            try {
              let decodedData = userDataRaw;
              for (let i = 0; i < 3; i++) {
                if (decodedData.includes("%")) decodedData = decodeURIComponent(decodedData);
              }
              const userObj = typeof decodedData === "string" ? JSON.parse(decodedData) : decodedData;
              localStorage.setItem("user", JSON.stringify(userObj));
              localStorage.setItem("role", role);
            } catch (e) {
              console.error("Gagal simpan session Google:", e);
              localStorage.setItem("user", JSON.stringify({ name: "Google User" }));
              localStorage.setItem("role", role);
            }
          } else {
            localStorage.setItem("user", JSON.stringify({ name: "Google User" }));
            localStorage.setItem("role", role);
          }

          // Segera perbarui state navbar agar tombol logout langsung muncul
          if (typeof window.initNavbarState === "function") {
            window.initNavbarState();
          }

          const pesan = googleType === "register" ? "Pendaftaran dengan Google berhasil" : "Masuk dengan Google berhasil";

          showPopupModal(true, pesan);
          window.history.replaceState(null, null, window.location.pathname);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const categoryBtns = document.querySelectorAll(".category-btn");
        const searchInput = document.getElementById("searchInput");
        const modalCloseBtn = document.getElementById("modalCloseBtn");

       // 1. EVENT LISTENER KATEGORI & PENCARIAN
      categoryBtns.forEach((button) => {
        button.addEventListener("click", () => {
          window.selectedCategory = button.getAttribute("data-category") || "semua";
          categoryBtns.forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
          renderKuliner(); // Memanggil fungsi render yang ada di luar
        });
      });

      if (searchInput) {
        searchInput.addEventListener("input", () => {
          renderKuliner();
        });
      }

      if (modalCloseBtn) {
        modalCloseBtn.addEventListener("click", () => {
          const mapEl = document.getElementById("map");
          if (mapEl) mapEl.style.visibility = "visible";
          const responseModal = document.getElementById("responseModal");
          if (responseModal) responseModal.classList.remove("show");

          if (typeof window.initNavbarState === "function") {
            window.initNavbarState();
          }
        });
      }

      function renderKuliner() {
        const foodGrid = document.getElementById("foodGrid");
        const emptyMessage = document.getElementById("emptyMessage");
        const searchInput = document.getElementById("searchInput");
        if (!foodGrid) return;

        const keyword = searchInput ? searchInput.value.trim().toLocaleLowerCase("id-ID") : "";
        const selectedCat = (window.selectedCategory || "semua").trim().toLowerCase();

        const filteredKuliner = window.allKuliner.filter((item) => {
          const rawCategory = item.kategori || item.nama_kategori || item.kategori_kuliner || item.jenis || "";
          const category = String(rawCategory).trim().toLowerCase();

          const name = String(item.nama_kuliner || item.nama || "").toLowerCase();
          const place = String(item.nama_tempat || "").toLowerCase();
          const address = String(item.alamat || "").toLowerCase();
          const description = String(item.deskripsi || "").toLowerCase();

          const matchesCategory = selectedCat === "semua" || category === selectedCat || category.includes(selectedCat);
          const matchesSearch = !keyword || name.includes(keyword) || place.includes(keyword) || address.includes(keyword) || description.includes(keyword);

          return matchesCategory && matchesSearch;
        });

        // VALIDASI JIKA KULINER TIDAK DITEMUKAN (100% PERSIS FIGMA TERBARU)
        if (filteredKuliner.length === 0) {
          foodGrid.innerHTML = "";
          foodGrid.style.display = "none";
          if (emptyMessage) {
            emptyMessage.innerHTML = `
              <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 40px 0; gap: 8px; font-family: 'Inter', sans-serif;">
                <span style="color: #001b7d; font-size: 15px; font-weight: 500;">Kuliner tidak ditemukan</span>
                <button onclick="window.location.reload()" style="background: transparent; border: none; color: #001b7d; font-size: 14px; font-weight: 400; display: flex; align-items: center; gap: 6px; cursor: pointer; outline: none; padding: 0;">
                  <span style="text-decoration: underline;">Coba Lagi</span>
              </div>
            `;
            emptyMessage.style.display = "block";
          }
          return;
        }

        if (emptyMessage) emptyMessage.style.display = "none";
        foodGrid.style.display = "flex";
        foodGrid.innerHTML = filteredKuliner
          .map((item) => {
            const name = escapeHTML(item.nama_kuliner || item.nama || "Nama kuliner");
            const place = escapeHTML(item.nama_tempat || "Tempat belum tersedia");
            const address = escapeHTML(item.alamat || "Alamat belum tersedia");
            const description = escapeHTML(item.deskripsi || "");

            const numericPrice = Number(item.harga);
            const price = Number.isFinite(numericPrice) ? numericPrice.toLocaleString("id-ID") : "0";
            const photo = getSafePhoto(item.foto);

            return `
            <article class="food-card">
              <img class="food-photo" src="${photo}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/400x300/e0e0e0/555555?text=Kuliner'" />
              <h3 class="food-name">${name}</h3>
              ${
                description
                  ? `<p class="food-description" style="font-size: 8px; color: #666; margin: 0 0 4px 0; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">${description}</p>`
                  : ""
              }
              <div class="food-location">
                <iconify-icon icon="lucide:map-pin" aria-hidden="true"></iconify-icon>
                <span>${place} — ${address}</span>
              </div>
              <div class="food-meta">
                <span>Rp ${price}</span>
                <div style="display: flex; align-items: center; gap: 2px;">
                  <iconify-icon icon="material-symbols:star" style="color: #FFBF00; font-size: 14px;"></iconify-icon>
                  <span style="font-weight: 900; font-size: 10px;">3.5</span>
                </div>
              </div>
            </article>
          `;
          })
          .join("");
      }

        loadKuliner();
        // 3. LOAD KULINER CARD
      async function loadKuliner() {
        const foodGrid = document.getElementById("foodGrid");
        const emptyMessage = document.getElementById("emptyMessage");
        if (foodGrid) foodGrid.setAttribute("aria-busy", "true");
        try {
          // Mengambil data dari kedua endpoint secara bersamaan
          const [resTempat, resKuliner] = await Promise.all([
            fetch(`${BASE_URL}/api/tempat_kuliner.php`),
            fetch(`${BASE_URL}/api/kuliner.php`)
          ]);

          if (!resTempat.ok || !resKuliner.ok) throw new Error("Gagal mengambil data dari server.");

          const jsonTempat = await resTempat.json();
          const jsonKuliner = await resKuliner.json();

          if (!jsonTempat.status || !Array.isArray(jsonTempat.data)) throw new Error("Format data tempat kuliner tidak sesuai.");
          if (!jsonKuliner.status || !Array.isArray(jsonKuliner.data)) throw new Error("Format data kuliner tidak sesuai.");

          // Membuat map untuk data kuliner berdasarkan id_kuliner agar mudah digabungkan
          const kulinerMap = new Map();
          jsonKuliner.data.forEach((k) => {
            kulinerMap.set(String(k.id_kuliner), k);
          });

          // GABUNGKAN JUGA PROPERTI KATEGORI DARI DETAIL KULINER
            window.allKuliner = jsonTempat.data.map((item) => {
            const detailKuliner = kulinerMap.get(String(item.id_kuliner)) || {};
            return {
              ...item,
              nama_kuliner: item.nama_kuliner || detailKuliner.nama_kuliner || detailKuliner.nama || "",
              kategori: detailKuliner.kategori || detailKuliner.nama_kategori || item.kategori || "", // Bawa data kategori
              deskripsi: detailKuliner.deskripsi || "",
              foto: detailKuliner.foto || "",
            };
          });

          renderKuliner();
        } catch (error) {
          console.error("Gagal memuat data kuliner:", error);
          if (foodGrid) {
            foodGrid.innerHTML = "";
            foodGrid.style.display = "none";
          }
          if (emptyMessage) {
            emptyMessage.textContent = "Data kuliner gagal dimuat. Periksa koneksi backend.";
            emptyMessage.style.display = "block";
          }
        } finally {
          if (foodGrid) foodGrid.setAttribute("aria-busy", "false");
        }
      }
        checkGoogleLoginSession();
      });
    </script>
