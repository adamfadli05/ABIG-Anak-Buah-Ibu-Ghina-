<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#001b7d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Kuliner | Mangan Yukkk</title>
    <link rel="stylesheet" href="css/Dashboard_Admin.css" />
    <link rel="stylesheet" href="css/tambah_kuliner_admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="js/env.js"></script>
    <script src="js/config.js"></script>
    <!-- Script Sidebar Terpusat -->
    <script src="js/sidebar.js?v=2" defer></script>
    <script src="js/tambah_kuliner_admin.js" defer></script>
  </head>
  <body>
    <!-- App Utama -->
    <div class="admin-app">
      <!-- PEMANGGILAN SIDEBAR DINAMIS -->
      <div id="sidebar-container"></div>

      <section class="main-panel">
        <header class="topbar">
          <div class="topbar-title">
            <span class="topbar-title-text">
              <strong>Panel</strong>
              <span>Admin</span>
            </span>
            <iconify-icon icon="lucide-extended:user-cog-filled" aria-hidden="true"></iconify-icon>
          </div>
        </header>

        <main class="dashboard-content add-culinary-content">
          <div class="content-header-flex" style="margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 1.5rem;">Tambah Kuliner</h1>
          </div>

          <form id="addCulinaryForm" class="add-culinary-form" novalidate>
            <div class="photo-field">
              <input id="culinaryPhoto" type="file" accept="image/jpeg,image/png,image/webp" hidden required />
              <button id="photoPicker" class="photo-picker" type="button" aria-label="Pilih foto kuliner">
                <span id="photoPlaceholder" class="photo-placeholder">
                  <iconify-icon icon="fluent-mdl2:photo-2-add" aria-hidden="true"></iconify-icon>
                  <span>Tambah Foto Kuliner</span>
                </span>
                <img id="photoPreview" class="photo-preview" alt="Pratinjau foto kuliner" hidden />
              </button>
              <span class="photo-help">Unggah foto JPG, PNG, atau WebP (maks. 5 MB).</span>
              <button id="removePhoto" class="remove-photo" type="button" hidden>Hapus foto</button>
            </div>

            <!-- Banner Peringatan Validasi (Muncul di bawah foto) -->
            <div id="formAlertBanner" class="form-alert-banner" hidden>
              <iconify-icon icon="lucide:alert-circle" aria-hidden="true"></iconify-icon>
              <span id="formAlertMessage">Pesan peringatan...</span>
            </div>

            <div class="form-grid">
              <!-- Kolom Kiri -->
              <div class="form-field">
                <label for="namaKuliner">Nama Kuliner <span>*</span></label>
                <input id="namaKuliner" name="nama_kuliner" type="text" placeholder="Masukan nama kuliner" required />
              </div>
              <!-- Kolom Kanan -->
              <div class="form-field">
                <label for="latitude">Latitude <span>*</span></label>
                <input id="latitude" name="latitude" type="number" step="0.000001" min="-90" max="90" placeholder="Masukan latitude" required />
              </div>

              <!-- Kolom Kiri -->
              <div class="form-field">
                <label for="harga">Harga Kuliner <span>*</span></label>
                <input id="harga" name="harga" type="number" min="0" placeholder="Masukan harga kuliner" required />
              </div>
              <!-- Kolom Kanan -->
              <div class="form-field">
                <label for="longitude">Longitude <span>*</span></label>
                <input id="longitude" name="longitude" type="number" step="0.000001" min="-180" max="180" placeholder="Masukan longitude" required />
              </div>

              <!-- Kolom Kiri -->
              <div class="form-field">
                <label for="kategori">Kategori Kuliner <span>*</span></label>
                <select id="kategori" name="kategori" required>
                  <option value="" selected disabled>Atur kategori kuliner</option>
                  <option value="Makanan">Makanan</option>
                  <option value="Minuman">Minuman</option>
                  <option value="Cemilan">Cemilan</option>
                </select>
              </div>
              <!-- Kolom Kanan -->
              <div class="form-field">
                <label>Jam Operasional</label>
                <div class="operating-hours">
                  <input id="jamBuka" name="jam_buka" type="time" aria-label="Jam buka" />
                  <span>sampai</span>
                  <input id="jamTutup" name="jam_tutup" type="time" aria-label="Jam tutup" />
                </div>
              </div>

              <!-- Kolom Kiri -->
              <div class="form-field">
                <label for="alamat">Alamat Kuliner <span>*</span></label>
                <input id="alamat" name="alamat" type="text" placeholder="Masukan alamat kuliner" required />
              </div>
              <!-- Kolom Kanan -->
              <div class="form-field">
                <label for="telepon">Nomor Telepon</label>
                <input id="telepon" name="no_telepon" type="tel" placeholder="Masukan nomor telepon" />
              </div>

              <!-- Deskripsi Kuliner (Melebar penuh ke bawah menutupi ruang kosong) -->
              <div class="form-field form-field-wide" style="grid-column: span 2;">
                <label for="deskripsi">Deskripsi Kuliner <span>*</span></label>
                <textarea id="deskripsi" name="deskripsi" rows="3" placeholder="Masukan deskripsi singkat kuliner" required></textarea>
              </div>
            </div>
            
            <p id="formMessage" class="form-message" role="status" aria-live="polite" hidden></p>
            <div class="form-actions">
              <a class="button button-cancel" href="daftar_kuliner_admin.html">Batal</a>
              <button class="button button-primary" type="submit">Simpan</button>
            </div>
          </form>
        </main>
      </section>
    </div>
  </body>
</html>
